name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release image and artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        shell: bash
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Set image name and version
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macmapd" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=stable
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push release images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build cargo-dist release artifacts
        env:
          CONTAINER_ENGINE: docker
        run: just dist-build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: macmapd ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/distrib/*.tar.xz
            target/distrib/*.sha256
