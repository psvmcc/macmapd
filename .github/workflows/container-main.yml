name: Publish main container

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: container-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    name: Build and publish latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macdack" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=latest
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build latest image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test latest image
        env:
          CONTAINER_ENGINE: docker
          LATEST_IMAGE: ${{ steps.image.outputs.name }}:latest
        run: sh scripts/docker-smoke.sh "$LATEST_IMAGE"

      - name: Push tested latest image
        env:
          LATEST_IMAGE: ${{ steps.image.outputs.name }}:latest
        run: docker push "$LATEST_IMAGE"
