name: CI

on:
  workflow_call:
    inputs:
      skip_container_checks:
        description: Skip the CI image because the caller builds and tests the publishable image
        required: false
        type: boolean
        default: false
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run checks and unit tests
        run: just check

      - name: Run integration tests
        run: just test-integration

      - name: Build release binary
        run: just build-release

      - name: Build amd64 container
        if: ${{ !inputs.skip_container_checks }}
        env:
          CONTAINER_ENGINE: docker
          TAG: ci
        run: just container-build

      - name: Test real DHCP server and state recovery
        if: ${{ !inputs.skip_container_checks }}
        run: just docker-smoke macdack:ci-amd64
